name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  # ── Stage 1: fast static checks ──────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck

  # ── Stage 2: test matrix (parallel) ──────────────────────────────────
  unit-tests:
    name: TypeScript tests
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lumixprotocol
          POSTGRES_PASSWORD: lumixprotocol
          POSTGRES_DB: lumixprotocol
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumixprotocol"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://lumixprotocol:lumixprotocol@localhost:5432/lumixprotocol
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run database migrations
        run: npm run db:migrate
      - name: Run TypeScript test suites
        run: npm run test:ts

  contracts:
    name: Soroban contracts (Rust)
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts/stellar
            contracts/stellar/lean_imt
      - name: Test Soroban workspace
        working-directory: contracts/stellar
        run: cargo test --workspace
      - name: Test lean_imt (standalone crate)
        working-directory: contracts/stellar/lean_imt
        run: cargo test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 20
    env:
      # Public client identifier baked into the bundle at build time; real
      # deployments override this via repository variables.
      NEXT_PUBLIC_PRIVY_APP_ID: ${{ vars.NEXT_PUBLIC_PRIVY_APP_ID || 'clci4t8bh00sil708vplkoyuo' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/.next
          include-hidden-files: true
          retention-days: 7

  # ── Stage 3: security gates ──────────────────────────────────────────
  security-gates:
    name: Security gates
    runs-on: ubuntu-latest
    needs: [unit-tests, contracts, frontend]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Static security gates
        run: npm run security:gates

  # ── Stage 4: pipeline gate ───────────────────────────────────────────
  ci-green:
    name: CI green
    runs-on: ubuntu-latest
    needs: security-gates
    timeout-minutes: 5
    steps:
      - name: All stages passed
        run: |
          echo "Lint -> Typecheck -> Tests (TS / Contracts / Frontend) -> Security gates: all green"
